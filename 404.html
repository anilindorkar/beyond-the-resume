<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Anil Indorkar</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f9fc" />
    <!--
      Styles are inlined rather than linked: GitHub Pages serves this file for any
      unmatched path, so relative asset URLs would break at nested depths.
    -->
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f9fc;
        --text: #475569;
        --heading: #020617;
        --accent: #0f766e;
        --accent-contrast: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #020617;
          --text: #94a3b8;
          --heading: #f8fafc;
          --accent: #5eead4;
          --accent-contrast: #022c26;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      main {
        max-width: 34rem;
        text-align: center;
      }

      p.code {
        margin: 0 0 1rem;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 0.78rem;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 1rem;
        color: var(--heading);
        letter-spacing: -0.03em;
        line-height: 1.15;
        font-size: clamp(1.9rem, 5vw, 2.75rem);
      }

      p.message {
        margin: 0 0 2rem;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 3rem;
        padding: 0.85rem 1.4rem;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-contrast);
        font-weight: 600;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid var(--heading);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>This page could not be found.</h1>
      <p class="message">
        The link may be out of date or the page may have moved. Everything else is still on the
        profile home page.
      </p>
      <a href="https://anilindorkar.github.io/beyond-the-resume/">Back to the profile</a>
    </main>
  </body>
</html>
